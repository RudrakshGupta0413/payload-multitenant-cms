services:
  postgres:
    restart: always
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: multi-tenant-poc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  # Payload CMS Application
  payload:
    build: .
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/multi-tenant-poc
      - PAYLOAD_SECRET=your-secret-here
      - NODE_ENV=production
      # S3 Configuration
      - S3_BUCKET=\${S3_BUCKET}
      - S3_REGION=\${S3_REGION}
      - S3_ACCESS_KEY_ID=\${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=\${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=\${S3_ENDPOINT}
      - GEMINI_API_KEY=\${GEMINI_API_KEY}
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  # Nginx reverse proxy for tenant routing
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '3001:3001'
      - '3002:3002'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
